name: Build RiuClicker Pro 2.0

on:
  push:
    branches: [main]
    paths:
      - '.build/pro2-rust-main-trigger.txt'
      - '.build/pro2-v20.patch.gz.b64'
      - '.build/pro2-xbutton-fix.patch'
      - '.github/workflows/pro2-rust-main-publish.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: riuclicker-pro2-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore Pro 2.0 source
        shell: bash
        run: |
          set -euo pipefail
          export MSYS2_ARG_CONV_EXCL='*'
          git fetch --no-tags origin pro2-rust:refs/remotes/origin/pro2-rust
          : > pro2-rust.tar.gz.b64
          for part in 00 01 02 03 04; do
            git show "origin/pro2-rust:.build/pro2-rust.part${part}" >> pro2-rust.tar.gz.b64
          done
          tr -d '\r\n' < pro2-rust.tar.gz.b64 | base64 -d > pro2-rust.tar.gz
          echo 'fe5ab7fbd3a3b31706790ecc6ac46dfc90f44912821d97736ffdf9b95f9702dc  pro2-rust.tar.gz' | sha256sum -c -
          rm -rf pro2-rust
          tar -xzf pro2-rust.tar.gz
          test -f pro2-rust/src-tauri/src/main.rs
          test -f pro2-rust/ui/index.html
          test -f pro2-rust/ui/app.js

      - name: Apply Pro 2.0 fixes
        shell: bash
        run: |
          set -euo pipefail
          base64 -d < .build/pro2-v20.patch.gz.b64 | gzip -dc > pro2-v20.patch
          git apply --check pro2-v20.patch
          git apply pro2-v20.patch
          git apply --check .build/pro2-xbutton-fix.patch
          git apply .build/pro2-xbutton-fix.patch
          grep -Fq 'macro_input_lock' pro2-rust/src-tauri/src/main.rs
          grep -Fq 'run_lobby_binding' pro2-rust/src-tauri/src/main.rs
          grep -Fq 'TRIGGER {command}' pro2-rust/src-tauri/src/main.rs
          grep -Fq 'e_action' pro2-rust/src-tauri/src/main.rs
          grep -Fq 'lobby_member_names' pro2-rust/src-tauri/src/main.rs
          grep -Fq 'Macro Lobby' pro2-rust/ui/index.html
          grep -Fq 'lobby-e-action' pro2-rust/ui/index.html
          grep -Fq 'lobby-v-action' pro2-rust/ui/index.html
          grep -Fq 'features = ["protocol-asset"]' pro2-rust/src-tauri/Cargo.toml
          grep -Fq 'RiuClicker Pro 2.0' pro2-rust/src-tauri/tauri.conf.json
          grep -Fq 'XBUTTON1 as i32' pro2-rust/src-tauri/src/main.rs
          grep -Fq 'XBUTTON2 as i32' pro2-rust/src-tauri/src/main.rs
          node --check pro2-rust/ui/app.js

      - name: Generate Windows icon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'pro2-rust/src-tauri/icons'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $path = Join-Path $dir 'icon.ico'
          $w = 32; $h = 32
          $pixelBytes = $w * $h * 4
          $maskStride = [int](($w + 31) / 32) * 4
          $maskBytes = $maskStride * $h
          $imageBytes = 40 + $pixelBytes + $maskBytes
          $fs = [IO.File]::Open($path, [IO.FileMode]::Create)
          $bw = [IO.BinaryWriter]::new($fs)
          try {
            $bw.Write([UInt16]0); $bw.Write([UInt16]1); $bw.Write([UInt16]1)
            $bw.Write([Byte]$w); $bw.Write([Byte]$h); $bw.Write([Byte]0); $bw.Write([Byte]0)
            $bw.Write([UInt16]1); $bw.Write([UInt16]32); $bw.Write([UInt32]$imageBytes); $bw.Write([UInt32]22)
            $bw.Write([UInt32]40); $bw.Write([Int32]$w); $bw.Write([Int32]($h * 2)); $bw.Write([UInt16]1); $bw.Write([UInt16]32)
            $bw.Write([UInt32]0); $bw.Write([UInt32]$pixelBytes); $bw.Write([Int32]0); $bw.Write([Int32]0); $bw.Write([UInt32]0); $bw.Write([UInt32]0)
            for ($y = 0; $y -lt $h; $y++) {
              for ($x = 0; $x -lt $w; $x++) {
                $dx = $x - 15.5; $dy = $y - 15.5
                if (($dx*$dx + $dy*$dy) -lt 220) {
                  $r = [Byte](110 + [int](($x / 31.0) * 95)); $g = [Byte](70 + [int](($y / 31.0) * 45)); $b = [Byte]238
                } else { $r = [Byte]14; $g = [Byte]16; $b = [Byte]30 }
                $bw.Write($b); $bw.Write($g); $bw.Write($r); $bw.Write([Byte]255)
              }
            }
            for ($i = 0; $i -lt $maskBytes; $i++) { $bw.Write([Byte]0) }
          } finally { $bw.Dispose(); $fs.Dispose() }
          if ((Get-Item $path).Length -lt 1000) { throw 'Generated icon is invalid' }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pro2-rust/src-tauri -> target
          cache-on-failure: true

      - name: Compile RiuClicker Pro 2.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --manifest-path pro2-rust/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Rust build failed' }
          New-Item -ItemType Directory -Path out -Force | Out-Null
          Copy-Item pro2-rust/src-tauri/target/release/riu-clicker-pro.exe out/RiuClicker-Pro-2.0-Beta.exe
          $size = (Get-Item out/RiuClicker-Pro-2.0-Beta.exe).Length
          if ($size -lt 3000000) { throw "EXE unexpectedly small: $size" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item out/RiuClicker-Pro-2.0-Beta.exe package/
          Compress-Archive -Path package/* -DestinationPath out/RiuClicker-Pro-2.0-Beta.zip -Force
          Compress-Archive -Path pro2-rust/* -DestinationPath out/RiuClicker-Pro-2.0-Beta-Source.zip -Force
          (Get-FileHash out/RiuClicker-Pro-2.0-Beta.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content out/RiuClicker-Pro-2.0-Beta.sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: RiuClicker-Pro-2.0-Beta
          path: |
            out/RiuClicker-Pro-2.0-Beta.exe
            out/RiuClicker-Pro-2.0-Beta.zip
            out/RiuClicker-Pro-2.0-Beta-Source.zip
            out/RiuClicker-Pro-2.0-Beta.sha256.txt
          retention-days: 30

      - name: Publish beta release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          @(
            '# RiuClicker Pro 2.0 Beta', '',
            '- New Pro 2.0 interface and startup intro',
            '- Hotkey labels update immediately',
            '- Bolt Push and Bolts can both stay enabled',
            '- Reliable V V V -> Shift ordering on Instant',
            '- Macro input serialization prevents sequences mixing',
            '- Macro Lobby with explicit join and local E/V action mapping',
            '- Only E/V lobby trigger messages are accepted',
            '- Coordinates, Wallhop, photo/video backgrounds, two clickers and F12 stop retained', '',
            'Macro Lobby is direct owner-hosted TCP. NAT/CGNAT may require router configuration.'
          ) | Set-Content notes.md
          $assets = @('out/RiuClicker-Pro-2.0-Beta.exe','out/RiuClicker-Pro-2.0-Beta.zip','out/RiuClicker-Pro-2.0-Beta-Source.zip','out/RiuClicker-Pro-2.0-Beta.sha256.txt')
          gh release view pro-v2.0-beta --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload pro-v2.0-beta $assets --clobber
            gh release edit pro-v2.0-beta --title 'RiuClicker Pro 2.0 Beta' --notes-file notes.md --prerelease
          } else {
            gh release create pro-v2.0-beta $assets --title 'RiuClicker Pro 2.0 Beta' --notes-file notes.md --target main --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish Pro 2.0 release' }

      - name: Record build status
        if: always()
        shell: pwsh
        run: |
          @(
            "status=${{ job.status }}",
            "run_id=${{ github.run_id }}",
            "commit=${{ github.sha }}",
            'tag=pro-v2.0-beta',
            'build=macro-lobby-reliable-macros',
            'engine=rust-aether'
          ) | Set-Content pro2-rust-main-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pro2-rust-main-status.txt
          git commit -m 'Record RiuClicker Pro 2.0 build status' 2>$null
          if ($LASTEXITCODE -eq 0) { git push }
