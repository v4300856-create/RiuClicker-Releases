name: Export RiuClicker Pro Source

on:
  push:
    branches: [main]
    paths:
      - '.build/pro-source-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  export:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified Riu source base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh api "/repos/${{ github.repository }}/actions/artifacts/9359887752/zip" > artifact.zip
          if ($LASTEXITCODE -ne 0) { throw 'Could not download verified source artifact' }
          Expand-Archive artifact.zip -DestinationPath artifact -Force
          $source = Get-ChildItem artifact -Recurse -Filter 'Riu-Strawberry-5.20-Source.zip' | Select-Object -First 1
          if (-not $source) { throw 'Source bundle missing' }
          Expand-Archive $source.FullName -DestinationPath src -Force

      - name: Apply latest 5.22 core fixes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          python .build/localization520-hotfix.py
          gh api -H "Accept: application/vnd.github.raw" "/repos/${{ github.repository }}/contents/.build/cps520-hotfix.py?ref=release/5.20-cpsfix" > cps520-hotfix.py
          python cps520-hotfix.py
          python .build/ui522-hotfix.py
          if ($LASTEXITCODE -ne 0) { throw 'Core patch failed' }

      - name: Apply verified Pro feature patch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh api -H "Accept: application/vnd.github.raw" "/repos/${{ github.repository }}/contents/.build/pro-riuclicker.py.gz.b64?ref=42814a2b32cb4cf143a562f8309358a35448e8f2" > verified-pro-patch.b64
          @'
          import base64, gzip, hashlib, pathlib
          encoded = pathlib.Path('verified-pro-patch.b64').read_text(encoding='utf-8').strip()
          raw = gzip.decompress(base64.b64decode(encoded))
          expected = 'f74a5f7417c929dbb91aab5071564f1541fe400dd833d0a3119deadd662fae86'
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'Pro patch SHA mismatch: {actual}')
          pathlib.Path('.build/pro-riuclicker.py').write_bytes(raw)
          '@ | Set-Content decode_pro.py -Encoding utf8
          python decode_pro.py
          python .build/pro-riuclicker.py
          if ($LASTEXITCODE -ne 0) { throw 'Pro patch failed' }
          $pro = Get-Content 'src/ProFeatures.cs' -Raw
          if (-not $pro.Contains('using System.IO;')) {
            $pro = $pro.Replace("using System.Collections.Concurrent;`r`n", "using System.Collections.Concurrent;`r`nusing System.IO;`r`n")
            if (-not $pro.Contains('using System.IO;')) {
              $pro = $pro.Replace("using System.Collections.Concurrent;`n", "using System.Collections.Concurrent;`nusing System.IO;`n")
            }
            Set-Content -Path 'src/ProFeatures.cs' -Value $pro -Encoding utf8
          }

      - name: Package generated Pro source
        shell: pwsh
        run: |
          Compress-Archive -Path src/* -DestinationPath RiuClicker-Pro-Generated-Source.zip -Force

      - name: Upload generated Pro source
        uses: actions/upload-artifact@v4
        with:
          name: RiuClicker-Pro-Generated-Source
          path: RiuClicker-Pro-Generated-Source.zip
          retention-days: 7

      - name: Record source export status
        if: always()
        shell: pwsh
        run: |
          @(
            "status=${{ job.status }}",
            "run_id=${{ github.run_id }}",
            "commit=${{ github.sha }}"
          ) | Set-Content pro-source-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pro-source-status.txt
          git commit -m 'Record Pro source export status' 2>$null
          if ($LASTEXITCODE -eq 0) { git push }
