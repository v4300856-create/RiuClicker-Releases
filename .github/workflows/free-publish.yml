# free-1.1-pulse
name: Publish Free RiuClicker

on:
  push:
    branches: [main]
    paths:
      - '.build/free-publish-trigger.txt'
      - '.build/free-v11-hotfix.py'
      - '.github/workflows/free-publish.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-free-riuclicker-dedicated
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified Riu source base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh api "/repos/${{ github.repository }}/actions/artifacts/9359887752/zip" > artifact.zip
          if ($LASTEXITCODE -ne 0) { throw 'Could not download verified source artifact' }
          Expand-Archive artifact.zip -DestinationPath artifact -Force
          $source = Get-ChildItem artifact -Recurse -Filter 'Riu-Strawberry-5.20-Source.zip' | Select-Object -First 1
          if (-not $source) { throw 'Source bundle missing' }
          Expand-Archive $source.FullName -DestinationPath src -Force
          if (-not (Test-Path 'src/RiuClickerCS.csproj')) { throw 'Source extraction failed' }

      - name: Apply latest Riu fixes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          python .build/localization520-hotfix.py
          if ($LASTEXITCODE -ne 0) { throw 'Localization hotfix failed' }
          gh api -H "Accept: application/vnd.github.raw" "/repos/${{ github.repository }}/contents/.build/cps520-hotfix.py?ref=release/5.20-cpsfix" > cps520-hotfix.py
          if ($LASTEXITCODE -ne 0) { throw 'Could not download CPS hotfix helper' }
          python cps520-hotfix.py
          if ($LASTEXITCODE -ne 0) { throw 'CPS hotfix failed' }
          python .build/ui522-hotfix.py
          if ($LASTEXITCODE -ne 0) { throw '5.22 UI/video patch failed' }
          python .build/free-riuclicker.py
          if ($LASTEXITCODE -ne 0) { throw 'Free edition patch failed' }
          python .build/free-v11-hotfix.py
          if ($LASTEXITCODE -ne 0) { throw 'Free 1.1 reliability/UI patch failed' }

      - name: Validate Free 1.1 edition
        shell: pwsh
        run: |
          if (-not (Select-String -Path 'src/RiuClickerCS.csproj' -Pattern '<Version>1.1.0</Version>' -SimpleMatch)) { throw 'Free 1.1 version missing' }
          if (-not (Select-String -Path 'src/Models.cs' -Pattern 'Free RiuClicker' -SimpleMatch)) { throw 'Free branding missing' }
          if (-not (Select-String -Path 'src/InputService.cs' -Pattern 'MouseClickHeld' -SimpleMatch)) { throw 'Reliable macro click helper missing' }
          if (-not (Select-String -Path 'src/Engines.cs' -Pattern 'MouseClickHeld' -SimpleMatch)) { throw 'Macro engine reliable click patch missing' }
          if (-not (Select-String -Path 'src/BrandVisual.cs' -Pattern 'PULSE UI' -SimpleMatch)) { throw 'Pulse UI branding missing' }
          if (Select-String -Path 'src/MainWindow.xaml' -Pattern 'Tag="turbo"' -SimpleMatch) { throw 'Turbo macro mode still visible' }
          if (Select-String -Path 'src/MainWindow.xaml' -Pattern 'Tag="instant"' -SimpleMatch) { throw 'Instant macro mode still visible' }
          if (Select-String -Path 'src/MainWindow.xaml' -Pattern 'Content="↗   Wallhop"' -SimpleMatch) { throw 'Wallhop navigation still visible' }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Free RiuClicker 1.1
        shell: pwsh
        run: |
          dotnet publish src/RiuClickerCS.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:AssemblyName=FreeRiuClicker `
            -p:ApplicationIcon=app.ico `
            -o out/free
          if ($LASTEXITCODE -ne 0) { throw 'Free RiuClicker build failed' }
          Copy-Item out/free/FreeRiuClicker.exe out/Free-RiuClicker.exe

      - name: Package Free RiuClicker
        shell: pwsh
        run: |
          if (-not (Test-Path 'out/Free-RiuClicker.exe')) { throw 'Free-RiuClicker.exe missing' }
          Compress-Archive -Path src/* -DestinationPath out/Free-RiuClicker-Source.zip -Force
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item out/Free-RiuClicker.exe package/
          Compress-Archive -Path package/* -DestinationPath out/Free-RiuClicker.zip -Force

      - name: Publish Free 1.1 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          @(
            '# Free RiuClicker 1.1 · Pulse',
            '',
            'Free English-only edition.',
            '',
            'What is new:',
            '- Reliable macro mouse clicks on Fast mode',
            '- Final coordinate click now uses a real 10-14 ms press instead of instant down/up',
            '- Small post-click settle so the last click is not lost',
            '- New Pulse UI with violet/cyan accents and cleaner cards',
            '- Updated Free 1.1 branding',
            '',
            'Included:',
            '- Auto Clicker',
            '- Coordinates',
            '- Macros with Stable and Fast modes',
            '- Profiles',
            '- Photo and video backgrounds',
            '- Precise CPS timing',
            '',
            'Free edition does not include Wallhop, Turbo/Instant modes, Strawberry Clicker, or extra languages.'
          ) | Set-Content release-notes.md
          $assets = @('out/Free-RiuClicker.exe','out/Free-RiuClicker.zip','out/Free-RiuClicker-Source.zip')
          gh release view free-v1.1 --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload free-v1.1 $assets --clobber
            gh release edit free-v1.1 --title 'Free RiuClicker 1.1 · Pulse' --notes-file release-notes.md --latest
          } else {
            gh release create free-v1.1 $assets --title 'Free RiuClicker 1.1 · Pulse' --notes-file release-notes.md --target main --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish Free RiuClicker 1.1 release' }

      - name: Verify public Free release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view free-v1.1 --json tagName,name,url,assets | ConvertFrom-Json
          if ($release.tagName -ne 'free-v1.1') { throw 'Wrong tag' }
          $names = @($release.assets | ForEach-Object { $_.name })
          foreach ($name in @('Free-RiuClicker.exe','Free-RiuClicker.zip','Free-RiuClicker-Source.zip')) {
            if ($name -notin $names) { throw "$name missing" }
          }
          Write-Host "Verified: $($release.url)"

      - name: Record Free publish status
        if: always()
        shell: pwsh
        run: |
          @(
            "status=${{ job.status }}",
            "run_id=${{ github.run_id }}",
            "commit=${{ github.sha }}",
            'tag=free-v1.1',
            'build=free-1.1-pulse-reliable-clicks',
            'publisher=dedicated'
          ) | Set-Content publish-free-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publish-free-status.txt
          git commit -m 'Record Free RiuClicker 1.1 publish status' 2>$null
          if ($LASTEXITCODE -eq 0) { git pull --rebase; git push }
