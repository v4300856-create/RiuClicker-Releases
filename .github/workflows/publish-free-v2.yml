name: Publish RiuClicker FREE 2.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-free-v2.yml'
      - '.build/v2/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-riuclicker-free-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      RIU_EDITION: FREE
      RIU_LICENSE_ENDPOINT: https://rpbjeexhbanaavazfmpo.supabase.co/functions/v1/riu-license
      RIU_GET_KEY_URL: https://lootdest.org/s?nbh5RgXk

    steps:
      - uses: actions/checkout@v4

      - name: Download clean 5.22 source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri 'https://github.com/v4300856-create/RiuClicker-Releases/releases/download/riu-v5.22-restored/RiuClicker-5.22-Source.zip' -OutFile base.zip
          Expand-Archive base.zip -DestinationPath src -Force
          if(-not (Test-Path src/RiuClickerCS.csproj)){throw '5.22 source missing'}

      - name: Apply 5.22 fixes and FREE key system
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          python .build/localization520-hotfix.py
          gh api -H "Accept: application/vnd.github.raw" "/repos/${{ github.repository }}/contents/.build/cps520-hotfix.py?ref=release/5.20-cpsfix" > cps520-hotfix.py
          python cps520-hotfix.py
          python .build/ui522-hotfix.py
          python .build/license-v1.py
          python .build/license-v11-online.py
          python .build/getkey-v1.py
          python .build/supabase-key-v11.py
          python .build/settings-save-v1.py
          python .build/pro-public/persistent_clicker_fix.py
          python .build/v2/common_ui_macro_v2.py
          python .build/v2/version_v2.py

      - name: Validate FREE 2.0
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          [xml](Get-Content src/App.xaml -Raw)|Out-Null
          [xml](Get-Content src/MainWindow.xaml -Raw)|Out-Null
          [xml](Get-Content src/ActivationWindow.xaml -Raw)|Out-Null
          [xml](Get-Content src/InterfacePickerWindow.xaml -Raw)|Out-Null
          foreach($m in @(
            'GET KEY · LOOTLABS','APPLY KEY','PollAsync','CreateSessionId',
            'PageMacros','MacroKeyHold','MacroModifierHold','MacroStepGap','MacroPointerSettle',
            'MacroStartDelay','MacroRepeatCount','MacroRepeatDelay','НАЧАТЬ ЗАПИСЬ',
            'CLASSIC','COMPACT','NEON','UiModeService.Apply','<Version>2.0.0</Version>'
          )){
            if(-not (Get-ChildItem src -Recurse -Include *.cs,*.xaml,*.csproj | Select-String -SimpleMatch $m)){throw "Missing marker: $m"}
          }
          if(Get-ChildItem src -Recurse -Include *.cs,*.xaml | Select-String -Pattern 'BOLT PUSH|ENABLE BOLTS|BOLTS ·' ){throw 'Bolts UI/functionality still present'}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build FREE 2.0
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet publish src/RiuClickerCS.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:AssemblyName=RiuClicker-Free `
            -p:ApplicationIcon=app.ico `
            -o out
          if($LASTEXITCODE -ne 0){throw 'Build failed'}
          Copy-Item out/RiuClicker-Free.exe out/RiuClicker-Free-2.0.exe
          (Get-FileHash out/RiuClicker-Free-2.0.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content out/RiuClicker-Free-2.0.sha256.txt

      - name: Publish FREE 2.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          @(
            '# RiuClicker FREE 2.0','',
            '- Original configurable 5.22 macro editor restored',
            '- Editable key/modifier/step/coordinate/start/repeat delays',
            '- Macro recording + manual key/mouse/coordinate/delay steps',
            '- Bolts and Bolt Push removed',
            '- Three startup interfaces: Classic / Compact / Neon',
            '- Redesigned LootLabs 24H key window',
            '- Persistent autoclicker stability fix'
          ) | Set-Content notes.md
          $tag='riu-free-v2'
          gh release view $tag *> $null
          if($LASTEXITCODE -eq 0){
            gh release upload $tag out/RiuClicker-Free-2.0.exe out/RiuClicker-Free-2.0.sha256.txt --clobber
            gh release edit $tag --title 'RiuClicker FREE 2.0' --notes-file notes.md
          } else {
            gh release create $tag out/RiuClicker-Free-2.0.exe out/RiuClicker-Free-2.0.sha256.txt --title 'RiuClicker FREE 2.0' --notes-file notes.md --target main
          }
