name: Publish RiuClicker 1.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v12.yml'
      - '.build/coord-once-v12.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-riuclicker-v12
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      RIU_LICENSE_ENDPOINT: https://rpbjeexhbanaavazfmpo.supabase.co/functions/v1/riu-license
      RIU_GET_KEY_URL: https://lootdest.org/s?nbh5RgXk
    steps:
      - uses: actions/checkout@v4

      - name: Download verified source base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh api "/repos/${{ github.repository }}/actions/artifacts/9359887752/zip" > artifact.zip
          Expand-Archive artifact.zip -DestinationPath artifact -Force
          $source = Get-ChildItem artifact -Recurse -Filter 'Riu-Strawberry-5.20-Source.zip' | Select-Object -First 1
          if (-not $source) { throw 'Source bundle missing' }
          Expand-Archive $source.FullName -DestinationPath src -Force

      - name: Apply RiuClicker 1.2 patches
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          python .build/localization520-hotfix.py
          gh api -H "Accept: application/vnd.github.raw" "/repos/${{ github.repository }}/contents/.build/cps520-hotfix.py?ref=release/5.20-cpsfix" > cps520-hotfix.py
          python cps520-hotfix.py
          python .build/ui522-hotfix.py
          python .build/bolts-523.py
          python .build/bolts-third-v1.py
          python .build/dualcoord-lock-v11.py
          python .build/license-v1.py
          python .build/license-v11-online.py
          python .build/getkey-v1.py
          python .build/supabase-key-v11.py
          python .build/settings-save-v1.py
          python .build/startup-banner-v1.py
          python .build/version-11.py
          python .build/coord-once-v12.py

      - name: Validate source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml](Get-Content 'src/App.xaml' -Raw) | Out-Null
          [xml](Get-Content 'src/ActivationWindow.xaml' -Raw) | Out-Null
          [xml](Get-Content 'src/MainWindow.xaml' -Raw) | Out-Null
          foreach ($marker in @('RiuClicker 1.2','GET KEY','APPLY KEY','PollAsync','CreateSessionId','CLICK VVV CLICK','FIRST COORDINATE','SECOND COORDINATE','SET BOTH COORDS ONCE · SAVED PERMANENTLY','<Version>1.2.0</Version>')) {
            if (-not (Get-ChildItem src -Include '*.cs','*.xaml','*.csproj' -File -Recurse | Select-String -Pattern $marker -SimpleMatch)) { throw "Missing marker: $marker" }
          }
          if (Get-ChildItem src -Include '*.xaml','*.cs' -File -Recurse | Select-String -Pattern 'RESET COORDS' -SimpleMatch) { throw 'RESET COORDS still present' }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build RiuClicker 1.2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src/RiuClickerCS.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:AssemblyName=RiuClicker `
            -p:ApplicationIcon=app.ico `
            -o out/v12
          Copy-Item out/v12/RiuClicker.exe out/RiuClicker-1.2.exe
          if ((Get-Item 'out/RiuClicker-1.2.exe').Length -lt 10000000) { throw 'EXE unexpectedly small' }
          (Get-FileHash out/RiuClicker-1.2.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content out/RiuClicker-1.2.sha256.txt

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          @(
            '# RiuClicker 1.2',
            '',
            '- Coordinates for CLICK VVV CLICK are configured once',
            '- Both coordinates lock permanently after first setup',
            '- Locked coordinates persist after restart',
            '- RESET COORDS removed to prevent accidental changes',
            '- GET KEY / APPLY KEY and 24-hour online license retained',
            '- Existing macros retained'
          ) | Set-Content notes.md
          gh release view riu-v1.2 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload riu-v1.2 out/RiuClicker-1.2.exe out/RiuClicker-1.2.sha256.txt --clobber
            gh release edit riu-v1.2 --title 'RiuClicker 1.2' --notes-file notes.md --latest
          } else {
            gh release create riu-v1.2 out/RiuClicker-1.2.exe out/RiuClicker-1.2.sha256.txt --title 'RiuClicker 1.2' --notes-file notes.md --target main --latest
          }

      - name: Record status
        if: always()
        shell: pwsh
        run: |
          @(
            "status=${{ job.status }}",
            "run_id=${{ github.run_id }}",
            "commit=${{ github.sha }}",
            'tag=riu-v1.2',
            'build=riuclicker-1.2-permanent-coordinate-lock'
          ) | Set-Content riu-v12-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add riu-v12-status.txt
          git commit -m 'Record RiuClicker 1.2 status' 2>$null
          if ($LASTEXITCODE -eq 0) { git pull --rebase; git push }
