name: Build RiuClicker Admin Preview

on:
  push:
    branches: [main]
    paths:
      - 'admin-preview/**'
      - '.github/workflows/admin-preview-build.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish admin-preview/RiuClickerAdmin.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          if (-not (Test-Path out/RiuClicker-Admin.exe)) { throw 'EXE missing' }
          (Get-FileHash out/RiuClicker-Admin.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content out/RiuClicker-Admin.sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: RiuClicker-Admin-Preview
          path: |
            out/RiuClicker-Admin.exe
            out/RiuClicker-Admin.sha256.txt
          retention-days: 30

      - name: Publish preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view riu-admin-v1.0 --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload riu-admin-v1.0 out/RiuClicker-Admin.exe out/RiuClicker-Admin.sha256.txt --clobber
          } else {
            gh release create riu-admin-v1.0 out/RiuClicker-Admin.exe out/RiuClicker-Admin.sha256.txt --title 'RiuClicker Admin 1.0' --notes 'C# WPF server-backed RiuClicker Pro license admin. Create, revoke and reset HWID for real Pro keys.'
          }
