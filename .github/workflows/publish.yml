name: Publish Clickers

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download prepared builds
        shell: pwsh
        run: |
          $url = 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-8708-8246-b32e-8849b5269eec/raw?se=2026-08-17T05%3A38%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=650c16fe-bb27-5dd7-a199-729d55490a72&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-17T03%3A48%3A07Z&ske=2026-08-18T03%3A48%3A07Z&sks=b&skv=2026-02-06&sig=lNV/7rxyHJOyCpyxuR7j7GAAJF3%2BqbFPS9nbnBhW%2BAY%3D'
          Invoke-WebRequest -Uri $url -OutFile builds.zip
          Expand-Archive builds.zip -DestinationPath builds -Force
          Get-ChildItem builds -Recurse | Format-Table FullName,Length
          if (-not (Test-Path 'builds/RiuClicker-5.14.exe')) { throw 'RiuClicker missing' }
          if (-not (Test-Path 'builds/StrawberryClicker-5.14.exe')) { throw 'StrawberryClicker missing' }
      - name: Create public release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v5.14 --yes 2>$null
          gh release create v5.14 builds/RiuClicker-5.14.exe builds/StrawberryClicker-5.14.exe --title 'Riu + Strawberry Clicker 5.14' --notes 'Windows builds of Riu Clicker 5.14 and Strawberry Clicker 5.14.'
