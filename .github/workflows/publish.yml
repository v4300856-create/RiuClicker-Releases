name: Publish Clickers

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-clickers
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified 5.20 source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh api "/repos/${{ github.repository }}/actions/artifacts/9359887752/zip" > artifact.zip
          if ($LASTEXITCODE -ne 0) { throw 'Could not download verified 5.20 artifact' }
          Expand-Archive artifact.zip -DestinationPath artifact -Force
          $source = Get-ChildItem artifact -Recurse -Filter 'Riu-Strawberry-5.20-Source.zip' | Select-Object -First 1
          if (-not $source) { throw '5.20 source bundle missing' }
          Expand-Archive $source.FullName -DestinationPath src -Force
          if (-not (Test-Path 'src/RiuClickerCS.csproj')) { throw 'Source extraction failed' }

      - name: Apply localization and CPS hotfixes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          python .build/localization520-hotfix.py
          if ($LASTEXITCODE -ne 0) { throw 'Localization hotfix failed' }

          gh api -H "Accept: application/vnd.github.raw" "/repos/${{ github.repository }}/contents/.build/cps520-hotfix.py?ref=release/5.20-cpsfix" > cps520-hotfix.py
          if ($LASTEXITCODE -ne 0) { throw 'Could not download CPS hotfix helper' }
          python cps520-hotfix.py
          if ($LASTEXITCODE -ne 0) { throw 'CPS hotfix failed' }

          foreach ($marker in @('localizedFromEnglish','NormalizeCps','WaitUntil','nextClickTick','SendMouseClick','Maximum="5000"')) {
            if (-not (Get-ChildItem src -Include '*.cs','*.xaml' -File -Recurse | Select-String -Pattern $marker -SimpleMatch)) { throw "Hotfix marker missing: $marker" }
          }
          if (Get-ChildItem src -Include '*.cs' -File -Recurse | Select-String -Pattern 'Math.Clamp(settings.Cps, 0.1, 500)' -SimpleMatch) { throw 'Engine 500 CPS clamp still present' }
          if (Get-ChildItem src -Include '*.cs' -File -Recurse | Select-String -Pattern 'Math.Clamp(c.Cps, 0.1, 500)' -SimpleMatch) { throw 'Settings 500 CPS clamp still present' }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Riu 5.20 hotfix
        shell: pwsh
        run: |
          dotnet publish src/RiuClickerCS.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:AssemblyName=RiuClicker `
            -p:ApplicationIcon=app.ico `
            -o out/riu
          if ($LASTEXITCODE -ne 0) { throw 'Riu 5.20 build failed' }
          Copy-Item out/riu/RiuClicker.exe out/RiuClicker-5.20.exe

      - name: Build Strawberry 5.20 hotfix
        shell: pwsh
        run: |
          dotnet publish src/RiuClickerCS.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DefineConstants=STRAWBERRY `
            -p:AssemblyName=StrawberryClicker `
            -p:ApplicationIcon=strawberry.ico `
            -o out/strawberry
          if ($LASTEXITCODE -ne 0) { throw 'Strawberry 5.20 build failed' }
          Copy-Item out/strawberry/StrawberryClicker.exe out/StrawberryClicker-5.20.exe

      - name: Package 5.20 hotfix
        shell: pwsh
        run: |
          foreach ($f in @('out/RiuClicker-5.20.exe','out/StrawberryClicker-5.20.exe')) {
            if (-not (Test-Path $f)) { throw "$f missing" }
            if ((Get-Item $f).Length -lt 10000000) { throw "$f unexpectedly small" }
          }
          Compress-Archive -Path src/* -DestinationPath out/Riu-Strawberry-5.20-Source.zip -Force
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item out/RiuClicker-5.20.exe package/
          Copy-Item out/StrawberryClicker-5.20.exe package/
          Copy-Item out/Riu-Strawberry-5.20-Source.zip package/
          Compress-Archive -Path package/* -DestinationPath out/Riu-and-Strawberry-5.20.zip -Force

      - name: Update public release 5.20
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          @(
            'Riu + Strawberry Clicker 5.20 hotfix.',
            '',
            'Changes:',
            '- Removed the old 500 CPS software cap from the engine, settings loader and CPS input.',
            '- CPS slider now starts at 5000 and expands automatically when a higher CPS value is typed.',
            '- New high-resolution absolute-deadline scheduler: 500 CPS targets a real 2 ms cadence without accumulating Task.Delay or SendInput drift.',
            '- Mouse down/up are sent together in one SendInput batch for lower overhead.',
            '- Mixed-language localization hotfix retained.',
            '- 3D Riu / Strawberry branding, panel transparency, wallhop fixes and all previous 5.20 features retained.',
            '',
            'Note: extremely high CPS can still be limited by Windows, the target app, hardware, CPU load or the CPS tester itself; there is no longer an artificial 500 CPS cap in Riu Clicker.'
          ) | Set-Content release-notes.md

          $assets = @(
            'out/RiuClicker-5.20.exe',
            'out/StrawberryClicker-5.20.exe',
            'out/Riu-and-Strawberry-5.20.zip',
            'out/Riu-Strawberry-5.20-Source.zip'
          )
          gh release upload v5.20 $assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not replace 5.20 assets' }
          gh release edit v5.20 --title 'Riu + Strawberry Clicker 5.20 · Localization + 3D + CPS Hotfix' --notes-file release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not update 5.20 release notes' }

      - name: Verify public release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh release view v5.20 --json tagName,name,url,assets | ConvertFrom-Json
          if ($release.tagName -ne 'v5.20') { throw 'Wrong release tag' }
          $names = @($release.assets | ForEach-Object { $_.name })
          foreach ($name in @('RiuClicker-5.20.exe','StrawberryClicker-5.20.exe','Riu-and-Strawberry-5.20.zip','Riu-Strawberry-5.20-Source.zip')) {
            if ($name -notin $names) { throw "$name missing from public release" }
          }
          Write-Host "Verified public release: $($release.url)"

      - name: Report publish status
        if: always()
        shell: pwsh
        run: |
          $status = '${{ job.status }}'
          @(
            "status=$status",
            "run_id=${{ github.run_id }}",
            "commit=${{ github.sha }}",
            'tag=v5.20',
            'hotfix=cps-unlimited-precise'
          ) | Set-Content publish-5.20-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publish-5.20-status.txt
          git commit -m "Record 5.20 CPS hotfix publish status" 2>$null
          if ($LASTEXITCODE -eq 0) { git push }
