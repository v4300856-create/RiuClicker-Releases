# free-riuclicker-1.0-cps-hotfix
name: Publish Free RiuClicker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish.yml'
      - '.build/free-riuclicker.py'
      - '.build/free-v10-cps-hotfix.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-free-riuclicker
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified Riu source base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh api "/repos/${{ github.repository }}/actions/artifacts/9359887752/zip" > artifact.zip
          if ($LASTEXITCODE -ne 0) { throw 'Could not download verified source artifact' }
          Expand-Archive artifact.zip -DestinationPath artifact -Force
          $source = Get-ChildItem artifact -Recurse -Filter 'Riu-Strawberry-5.20-Source.zip' | Select-Object -First 1
          if (-not $source) { throw 'Source bundle missing' }
          Expand-Archive $source.FullName -DestinationPath src -Force
          if (-not (Test-Path 'src/RiuClickerCS.csproj')) { throw 'Source extraction failed' }

      - name: Apply latest Riu fixes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          python .build/localization520-hotfix.py
          if ($LASTEXITCODE -ne 0) { throw 'Localization hotfix failed' }
          gh api -H "Accept: application/vnd.github.raw" "/repos/${{ github.repository }}/contents/.build/cps520-hotfix.py?ref=release/5.20-cpsfix" > cps520-hotfix.py
          if ($LASTEXITCODE -ne 0) { throw 'Could not download CPS hotfix helper' }
          python cps520-hotfix.py
          if ($LASTEXITCODE -ne 0) { throw 'CPS hotfix failed' }
          python .build/ui522-hotfix.py
          if ($LASTEXITCODE -ne 0) { throw '5.22 UI/video patch failed' }

      - name: Apply Free edition restrictions and high CPS fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .build/free-riuclicker.py
          if ($LASTEXITCODE -ne 0) { throw 'Free edition patch failed' }
          python .build/free-v10-cps-hotfix.py
          if ($LASTEXITCODE -ne 0) { throw 'Free v1.0 high CPS patch failed' }

          if (-not (Select-String -Path 'src/RiuClickerCS.csproj' -Pattern '<Version>1.0.0</Version>' -SimpleMatch)) { throw 'Free 1.0 version missing' }
          if (-not (Select-String -Path 'src/Models.cs' -Pattern 'Free RiuClicker' -SimpleMatch)) { throw 'Free branding missing' }
          if (-not (Select-String -Path 'src/Engines.cs' -Pattern 'HighResolutionTimer' -SimpleMatch)) { throw 'High CPS timer patch missing' }
          if (-not (Select-String -Path 'src/Engines.cs' -Pattern 'WaitUntil(nextTick, token)' -SimpleMatch)) { throw 'High CPS precise loop missing' }
          if (Select-String -Path 'src/MainWindow.xaml' -Pattern 'Tag="turbo"' -SimpleMatch) { throw 'Turbo macro mode still visible' }
          if (Select-String -Path 'src/MainWindow.xaml' -Pattern 'Tag="instant"' -SimpleMatch) { throw 'Instant macro mode still visible' }
          if (Select-String -Path 'src/MainWindow.xaml' -Pattern 'Content="↗   Wallhop"' -SimpleMatch) { throw 'Wallhop navigation still visible' }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Free RiuClicker
        shell: pwsh
        run: |
          dotnet publish src/RiuClickerCS.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:AssemblyName=FreeRiuClicker `
            -p:ApplicationIcon=app.ico `
            -o out/free
          if ($LASTEXITCODE -ne 0) { throw 'Free RiuClicker build failed' }
          Copy-Item out/free/FreeRiuClicker.exe out/Free-RiuClicker.exe

      - name: Package Free RiuClicker
        shell: pwsh
        run: |
          if (-not (Test-Path 'out/Free-RiuClicker.exe')) { throw 'Free-RiuClicker.exe missing' }
          if ((Get-Item 'out/Free-RiuClicker.exe').Length -lt 10000000) { throw 'Free-RiuClicker.exe unexpectedly small' }
          Compress-Archive -Path src/* -DestinationPath out/Free-RiuClicker-Source.zip -Force
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item out/Free-RiuClicker.exe package/
          Compress-Archive -Path package/* -DestinationPath out/Free-RiuClicker.zip -Force

      - name: Publish Free RiuClicker release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          @(
            '# Free RiuClicker 1.0',
            '',
            'Free English-only edition.',
            '',
            'Latest hotfix:',
            '- High CPS engine rewritten for precise timing',
            '- 500 CPS no longer uses Task.Delay(2 ms)',
            '- Windows 1 ms timer resolution + Stopwatch schedule',
            '- UI click counter throttled so it does not slow the engine',
            '',
            'Included:',
            '- Auto Clicker',
            '- Coordinates',
            '- Macros with Stable and Fast modes',
            '- Profiles',
            '- Photo and video backgrounds',
            '- Precise CPS timing'
          ) | Set-Content release-notes.md

          $assets = @('out/Free-RiuClicker.exe','out/Free-RiuClicker.zip','out/Free-RiuClicker-Source.zip')
          gh release view free-v1.0 --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload free-v1.0 $assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not upload Free RiuClicker assets' }
            gh release edit free-v1.0 --title 'Free RiuClicker 1.0' --notes-file release-notes.md --latest
          } else {
            gh release create free-v1.0 $assets --title 'Free RiuClicker 1.0' --notes-file release-notes.md --target main --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish Free RiuClicker release' }

      - name: Verify public Free release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh release view free-v1.0 --json tagName,name,url,assets | ConvertFrom-Json
          if ($release.tagName -ne 'free-v1.0') { throw 'Wrong Free release tag' }
          $names = @($release.assets | ForEach-Object { $_.name })
          foreach ($name in @('Free-RiuClicker.exe','Free-RiuClicker.zip','Free-RiuClicker-Source.zip')) {
            if ($name -notin $names) { throw "$name missing from public Free release" }
          }
          Write-Host "Verified public Free release: $($release.url)"

      - name: Record Free publish status
        if: always()
        shell: pwsh
        run: |
          @(
            "status=${{ job.status }}",
            "run_id=${{ github.run_id }}",
            "commit=${{ github.sha }}",
            'tag=free-v1.0',
            'build=free-v1.0-high-cps-stopwatch-v2'
          ) | Set-Content publish-free-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publish-free-status.txt
          git commit -m 'Record Free RiuClicker publish status' 2>$null
          if ($LASTEXITCODE -eq 0) { git pull --rebase; git push }
