name: Publish Clickers

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download prepared builds
        shell: pwsh
        run: |
          $url = 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-8fe0-81f4-bd5d-d241320110d6/raw?se=2026-08-17T20%3A06%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=75bf947f-dd0b-524b-acab-d4d0c982ea33&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-17T07%3A28%3A56Z&ske=2026-08-18T07%3A28%3A56Z&sks=b&skv=2026-02-06&sig=pqzzED4UiC7hMefLI8V8QdSJ3CxQ7XAMlgFr7aGHEw8%3D'
          Invoke-WebRequest -Uri $url -OutFile builds.zip
          Expand-Archive builds.zip -DestinationPath builds -Force
          if (-not (Test-Path 'builds/RiuClicker-5.16.exe')) { throw 'RiuClicker missing' }
          if (-not (Test-Path 'builds/StrawberryClicker-5.16.exe')) { throw 'StrawberryClicker missing' }
      - name: Create public release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v5.16 --yes 2>$null
          gh release create v5.16 builds/RiuClicker-5.16.exe builds/StrawberryClicker-5.16.exe --title 'Riu + Strawberry Clicker 5.16' --notes 'UI fix: readable dark dropdown lists and expanded RU/EN localization.'
