name: Publish Clickers

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-clickers
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download 5.17 build artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh api "/repos/${{ github.repository }}/actions/artifacts/9338715539/zip" > artifact.zip
          if ($LASTEXITCODE -ne 0) { throw 'Could not download build artifact' }

          Expand-Archive artifact.zip -DestinationPath artifact -Force

          $riu = Get-ChildItem artifact -Recurse -Filter 'RiuClicker-5.17.exe' | Select-Object -First 1
          $strawberry = Get-ChildItem artifact -Recurse -Filter 'StrawberryClicker-5.17.exe' | Select-Object -First 1
          $bundle = Get-ChildItem artifact -Recurse -Filter 'Riu-and-Strawberry-5.17.zip' | Select-Object -First 1

          if (-not $riu) { throw 'RiuClicker-5.17.exe missing' }
          if (-not $strawberry) { throw 'StrawberryClicker-5.17.exe missing' }

          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item $riu.FullName 'release/RiuClicker-5.17.exe'
          Copy-Item $strawberry.FullName 'release/StrawberryClicker-5.17.exe'
          if ($bundle) { Copy-Item $bundle.FullName 'release/Riu-and-Strawberry-5.17.zip' }

      - name: Create or update public release 5.17
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          @'
          Wallhop stability + UI refresh.

          Changes:
          - Fixed wallhop overlap on rapid repeated hotkey presses.
          - Camera return is guaranteed after the wallhop movement sequence.
          - Relative mouse movement uses no-coalescing for more stable short bursts.
          - Refreshed dark interface and dropdown styling.
          - Wallhop presets now show actual pixel movement values.
          - Added clearer wallhop status in the interface.
          '@ | Set-Content release-notes.md

          $assets = @('release/RiuClicker-5.17.exe', 'release/StrawberryClicker-5.17.exe')
          if (Test-Path 'release/Riu-and-Strawberry-5.17.zip') { $assets += 'release/Riu-and-Strawberry-5.17.zip' }

          gh release view v5.17 --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v5.17 $assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not upload 5.17 assets' }
            gh release edit v5.17 --title 'Riu + Strawberry Clicker 5.17' --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not update 5.17 release notes' }
          } else {
            gh release create v5.17 $assets --title 'Riu + Strawberry Clicker 5.17' --notes-file release-notes.md --target main
            if ($LASTEXITCODE -ne 0) { throw 'Could not create 5.17 release' }
          }

      - name: Verify public release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh release view v5.17 --json tagName,name,url,assets | ConvertFrom-Json
          if ($release.tagName -ne 'v5.17') { throw 'Wrong release tag' }
          $names = @($release.assets | ForEach-Object { $_.name })
          if ('RiuClicker-5.17.exe' -notin $names) { throw 'Riu asset missing from release' }
          if ('StrawberryClicker-5.17.exe' -notin $names) { throw 'Strawberry asset missing from release' }
          Write-Host "Verified: $($release.url)"

      - name: Report publish status
        if: always()
        shell: pwsh
        run: |
          $status = '${{ job.status }}'
          @"
          status=$status
          run_id=${{ github.run_id }}
          commit=${{ github.sha }}
          tag=v5.17
          "@ | Set-Content publish-5.17-status.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publish-5.17-status.txt
          git commit -m "Record 5.17 publish status" 2>$null
          if ($LASTEXITCODE -eq 0) { git push }
