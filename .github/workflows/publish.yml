# cleanup-trigger-2
name: Remove All Autoclicker Releases

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete all GitHub Releases and release tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tags < <(gh release list --limit 1000 --json tagName --jq '.[].tagName')
          echo "Found ${#tags[@]} releases"
          for tag in "${tags[@]}"; do
            echo "Deleting release $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done

      - name: Verify no releases remain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          count=$(gh release list --limit 1000 --json tagName --jq 'length')
          if [ "$count" != "0" ]; then
            echo "Releases still remain: $count"
            gh release list --limit 1000
            exit 1
          fi
          echo "All releases removed"

      - name: Record cleanup status
        if: always()
        shell: bash
        run: |
          printf 'status=%s\nrun_id=%s\naction=remove-all-autoclicker-releases\n' "${{ job.status }}" "${{ github.run_id }}" > release-cleanup-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-cleanup-status.txt
          git commit -m 'Record release cleanup status' || true
          git push || true
