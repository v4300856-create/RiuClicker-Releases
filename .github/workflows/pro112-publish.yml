name: Publish RiuClicker Pro 1.1.2

on:
  push:
    branches: [main]
    paths:
      - '.build/pro112-publish-trigger.txt'
      - '.github/workflows/pro112-publish.yml'
      - '.build/pro112-hotfix.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-riuclicker-pro112
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified Pro 1.1.1 source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh api "/repos/${{ github.repository }}/actions/artifacts/9509565221/zip" > artifact.zip
          if ($LASTEXITCODE -ne 0) { throw 'Could not download Pro 1.1.1 artifact' }
          Expand-Archive artifact.zip -DestinationPath artifact -Force
          $source = Get-ChildItem artifact -Recurse -Filter 'RiuClicker-Pro-1.1.1-Beta-Source.zip' | Select-Object -First 1
          if (-not $source) { throw 'Pro 1.1.1 source bundle missing' }
          Expand-Archive $source.FullName -DestinationPath src -Force
          if (-not (Test-Path 'src/RiuClickerCS.csproj')) { throw 'Source extraction failed' }

      - name: Apply instant hotkey UI fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .build/pro112-hotfix.py
          if ($LASTEXITCODE -ne 0) { throw 'Pro 1.1.2 hotfix failed' }

      - name: Validate Pro 1.1.2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml](Get-Content 'src/MainWindow.xaml' -Raw) | Out-Null
          if (-not (Select-String 'src/MainWindow.Extras.cs' -Pattern 'b.Content = "PRESS KEY…"' -SimpleMatch)) { throw 'Capture prompt missing' }
          if (-not (Select-String 'src/MainWindow.Extras.cs' -Pattern 'HotkeyCaptureLabel(target, key)' -SimpleMatch)) { throw 'Immediate button label update missing' }
          if (-not (Select-String 'src/MainWindow.Extras.cs' -Pattern 'private bool AssignCapturedHotkey' -SimpleMatch)) { throw 'Assignment success tracking missing' }
          if (-not (Select-String 'src/MainWindow.xaml.cs' -Pattern 'private Button? _captureButton;' -SimpleMatch)) { throw 'Capture button tracking missing' }
          if (-not (Select-String 'src/MainWindow.Pro.cs' -Pattern 'TapTripleVOrdered' -SimpleMatch)) { throw 'VVV order fix missing' }
          if (Select-String 'src/MainWindow.Pro.cs' -Pattern '_settings.ProActions.Bolts.Enabled = false;' -SimpleMatch) { throw 'Dual-action support regressed' }
          if (-not (Select-String 'src/MainWindow.xaml.cs' -Pattern 'e.Key == Key.Tab' -SimpleMatch)) { throw 'TAB capture fix missing' }
          if (-not (Select-String 'src/RiuClickerCS.csproj' -Pattern '<Version>1.1.2</Version>' -SimpleMatch)) { throw 'Version 1.1.2 missing' }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build RiuClicker Pro 1.1.2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src/RiuClickerCS.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:AssemblyName=RiuClickerPro `
            -p:ApplicationIcon=app.ico `
            -o out/pro
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          Copy-Item out/pro/RiuClickerPro.exe out/RiuClicker-Pro-1.1.2-Beta.exe
          if ((Get-Item 'out/RiuClicker-Pro-1.1.2-Beta.exe').Length -lt 10000000) { throw 'EXE unexpectedly small' }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item out/RiuClicker-Pro-1.1.2-Beta.exe package/
          Compress-Archive -Path package/* -DestinationPath out/RiuClicker-Pro-1.1.2-Beta.zip -Force
          Compress-Archive -Path src/* -DestinationPath out/RiuClicker-Pro-1.1.2-Beta-Source.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: RiuClicker-Pro-1.1.2-Beta
          path: |
            out/RiuClicker-Pro-1.1.2-Beta.exe
            out/RiuClicker-Pro-1.1.2-Beta.zip
            out/RiuClicker-Pro-1.1.2-Beta-Source.zip
          retention-days: 30

      - name: Publish beta release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          @(
            '# RiuClicker Pro 1.1.2 Beta',
            '',
            'Free RiuClicker is unchanged.',
            '',
            'Changes:',
            '- Hotkey button now instantly switches to PRESS KEY while capturing',
            '- The same button immediately changes to TAB / E / V / Mouse4 / etc after assignment',
            '- ESC restores the previous label',
            '- Applies to Auto Clicker, Bolt Push, Bolts, Wallhop, coordinates and macro hotkeys',
            '- Ordered V V V before Shift retained',
            '- Bolt Push and Bolts can stay enabled together',
            '- Prism Command UI, Wallhop and Squad Sync retained'
          ) | Set-Content notes.md
          $assets = @('out/RiuClicker-Pro-1.1.2-Beta.exe','out/RiuClicker-Pro-1.1.2-Beta.zip','out/RiuClicker-Pro-1.1.2-Beta-Source.zip')
          gh release view pro-v1.1.2-beta --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload pro-v1.1.2-beta $assets --clobber
            gh release edit pro-v1.1.2-beta --title 'RiuClicker Pro 1.1.2 Beta' --notes-file notes.md --prerelease
          } else {
            gh release create pro-v1.1.2-beta $assets --title 'RiuClicker Pro 1.1.2 Beta' --notes-file notes.md --target main --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed' }

      - name: Record status
        if: always()
        shell: pwsh
        run: |
          @(
            "status=${{ job.status }}",
            "run_id=${{ github.run_id }}",
            "commit=${{ github.sha }}",
            'tag=pro-v1.1.2-beta',
            'build=instant-hotkey-button-label'
          ) | Set-Content publish-pro112-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publish-pro112-status.txt
          git commit -m 'Record RiuClicker Pro 1.1.2 publish status' 2>$null
          if ($LASTEXITCODE -eq 0) { git push }
