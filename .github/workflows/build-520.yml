name: Build 5.20 Final

on:
  pull_request:
    branches: [main]
    paths:
      - '.build/visual520.part*'
      - '.github/workflows/build-520.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified green 5.20 source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh api "/repos/${{ github.repository }}/actions/artifacts/9357708831/zip" > base520-artifact.zip
          if ($LASTEXITCODE -ne 0) { throw 'Could not download verified green 5.20 artifact' }
          Expand-Archive base520-artifact.zip -DestinationPath base520 -Force
          $source = Get-ChildItem base520 -Recurse -Filter 'Riu-Strawberry-5.20-Source.zip' | Select-Object -First 1
          if (-not $source) { throw 'Verified 5.20 source zip missing' }
          Expand-Archive $source.FullName -DestinationPath src -Force
          if (-not (Test-Path 'src/RiuClickerCS.csproj')) { throw '5.20 source extraction failed' }

      - name: Apply final transparency and 3D branding polish
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem '.build/visual520.part*' | Sort-Object Name
          if ($parts.Count -ne 4) { throw "Expected 4 visual chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          if ($b64.Length -ne 18072) { throw "Wrong visual base64 length: $($b64.Length)" }
          $b64Hash = ([BitConverter]::ToString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($b64)))).Replace('-','').ToLower()
          if ($b64Hash -ne '4461d43a8ef782d0be932413079b1172aa5a0d9109cf50108cbb616d7a96d54f') { throw "Visual chunk hash mismatch: $b64Hash" }
          [IO.File]::WriteAllBytes('visual520.gz',[Convert]::FromBase64String($b64))
          python -c "import gzip,pathlib; pathlib.Path('visual520.diff').write_bytes(gzip.decompress(pathlib.Path('visual520.gz').read_bytes()))"
          if ($LASTEXITCODE -ne 0) { throw 'Could not decompress visual patch' }
          $visualHash = (Get-FileHash 'visual520.diff' -Algorithm SHA256).Hash.ToLower()
          if ($visualHash -ne 'a28599233d6994ca40fd8f7fb637853d0bf5b2ec3e0fc72f13d1483dfe4f464e') { throw "Visual patch hash mismatch: $visualHash" }
          Push-Location src
          git init
          git config user.name 'ci'
          git config user.email 'ci@example.invalid'
          git add .
          git commit -m 'verified green 5.20 source'
          git apply --whitespace=nowarn ..\visual520.diff
          if ($LASTEXITCODE -ne 0) { throw 'Could not apply final visual polish to verified 5.20 source' }
          Pop-Location

      - name: Static localization and feature checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Select-String -Path 'src/RiuClickerCS.csproj' -Pattern '<Version>5.20.0</Version>' -SimpleMatch)) { throw '5.20 project version missing' }
          foreach ($tag in @('Tag="ru"','Tag="en"','Tag="uk"','Tag="zh-CN"','Tag="de"','Tag="es"','Tag="fr"','Tag="pl"')) {
            if (-not (Select-String -Path 'src/MainWindow.xaml' -Pattern $tag -SimpleMatch)) { throw "Language option missing: $tag" }
          }
          foreach ($marker in @('Українська','简体中文','PanelOpacitySlider','HeaderBrandViewport','SidebarBrandViewport','CreateRiuModel','CreateStrawberryModel','Viewport3D','Прозрачность панелей')) {
            if (-not (Get-ChildItem src -Include '*.cs','*.xaml' -File -Recurse | Select-String -Pattern $marker -SimpleMatch)) { throw "Feature marker missing: $marker" }
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Riu 5.20
        shell: pwsh
        run: |
          dotnet publish src/RiuClickerCS.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:AssemblyName=RiuClicker `
            -p:ApplicationIcon=app.ico `
            -o out/riu
          if ($LASTEXITCODE -ne 0) { throw 'Riu 5.20 build failed' }
          Copy-Item out/riu/RiuClicker.exe out/RiuClicker-5.20.exe

      - name: Build Strawberry 5.20
        shell: pwsh
        run: |
          dotnet publish src/RiuClickerCS.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DefineConstants=STRAWBERRY `
            -p:AssemblyName=StrawberryClicker `
            -p:ApplicationIcon=strawberry.ico `
            -o out/strawberry
          if ($LASTEXITCODE -ne 0) { throw 'Strawberry 5.20 build failed' }
          Copy-Item out/strawberry/StrawberryClicker.exe out/StrawberryClicker-5.20.exe

      - name: Verify and package
        shell: pwsh
        run: |
          foreach ($f in @('out/RiuClicker-5.20.exe','out/StrawberryClicker-5.20.exe')) {
            if (-not (Test-Path $f)) { throw "$f missing" }
            if ((Get-Item $f).Length -lt 10000000) { throw "$f unexpectedly small" }
            Write-Host "$f = $((Get-Item $f).Length) bytes"
          }
          Compress-Archive -Path src/* -DestinationPath out/Riu-Strawberry-5.20-Source.zip -Force
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item out/RiuClicker-5.20.exe package/
          Copy-Item out/StrawberryClicker-5.20.exe package/
          Copy-Item out/Riu-Strawberry-5.20-Source.zip package/
          Compress-Archive -Path package/* -DestinationPath out/Riu-and-Strawberry-5.20.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Riu-Strawberry-5.20-final
          if-no-files-found: error
          path: |
            out/RiuClicker-5.20.exe
            out/StrawberryClicker-5.20.exe
            out/Riu-Strawberry-5.20-Source.zip
            out/Riu-and-Strawberry-5.20.zip
