name: Build 5.17 test

on:
  push:
    branches: [ "fix/wallhop-ui-5.17" ]
    paths:
      - '.build/source517.part*'
      - '.github/workflows/build-517.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source
        shell: pwsh
        run: |
          $parts = Get-ChildItem .build/source517.part* | Sort-Object Name
          if ($parts.Count -ne 8) { throw "Expected 8 source chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes("source517.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Path source517.zip -DestinationPath src -Force
          if (-not (Test-Path 'src/RiuClickerCS.csproj')) { throw 'Project file missing after source reconstruction' }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Riu
        shell: pwsh
        run: |
          dotnet publish src/RiuClickerCS.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:AssemblyName=RiuClicker `
            -p:ApplicationIcon=app.ico `
            -o out/riu
          Copy-Item out/riu/RiuClicker.exe out/RiuClicker-5.17.exe

      - name: Build Strawberry
        shell: pwsh
        run: |
          dotnet publish src/RiuClickerCS.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DefineConstants=STRAWBERRY `
            -p:AssemblyName=StrawberryClicker `
            -p:ApplicationIcon=strawberry.ico `
            -o out/strawberry
          Copy-Item out/strawberry/StrawberryClicker.exe out/StrawberryClicker-5.17.exe

      - name: Package source and builds
        shell: pwsh
        run: |
          Compress-Archive -Path src/* -DestinationPath out/Riu-Strawberry-5.17-Source.zip -Force
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item out/RiuClicker-5.17.exe package/
          Copy-Item out/StrawberryClicker-5.17.exe package/
          Copy-Item out/Riu-Strawberry-5.17-Source.zip package/
          Compress-Archive -Path package/* -DestinationPath out/Riu-and-Strawberry-5.17.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Riu-Strawberry-5.17
          if-no-files-found: error
          path: |
            out/RiuClicker-5.17.exe
            out/StrawberryClicker-5.17.exe
            out/Riu-Strawberry-5.17-Source.zip
            out/Riu-and-Strawberry-5.17.zip

      - name: Report build status
        if: always()
        shell: pwsh
        env:
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          New-Item -ItemType Directory -Path .build -Force | Out-Null
          @(
            "run_id=$env:RUN_ID"
            "job_status=$env:JOB_STATUS"
            "commit=${{ github.sha }}"
          ) | Set-Content .build/build517-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build/build517-status.txt
          git commit -m "CI: report 5.17 build $env:JOB_STATUS" || exit 0
          git push origin HEAD:fix/wallhop-ui-5.17
