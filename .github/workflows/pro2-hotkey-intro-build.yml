name: Build RiuClicker Pro 2.0 Hotkey Intro Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pro2-hotkey-intro-build.yml'
      - '.build/pro2-hotkey-intro-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: riuclicker-pro2-hotkey-intro
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore Pro 2.0 source
        shell: bash
        run: |
          set -euo pipefail
          export MSYS2_ARG_CONV_EXCL='*'
          git fetch --no-tags origin pro2-rust:refs/remotes/origin/pro2-rust
          : > pro2-rust.tar.gz.b64
          for part in 00 01 02 03 04; do
            git show "origin/pro2-rust:.build/pro2-rust.part${part}" >> pro2-rust.tar.gz.b64
          done
          tr -d '\r\n' < pro2-rust.tar.gz.b64 | base64 -d > pro2-rust.tar.gz
          echo 'fe5ab7fbd3a3b31706790ecc6ac46dfc90f44912821d97736ffdf9b95f9702dc  pro2-rust.tar.gz' | sha256sum -c -
          rm -rf pro2-rust
          tar -xzf pro2-rust.tar.gz

      - name: Apply Pro 2.0 Macro Lobby patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d < .build/pro2-v20.patch.gz.b64 | gzip -dc > pro2-v20.patch
          git apply --check pro2-v20.patch
          git apply pro2-v20.patch

      - name: Apply proven WinAPI compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('pro2-rust/src-tauri/src/main.rs')
          s = p.read_text(encoding='utf-8')
          s, n1 = re.subn(r'\bXBUTTON1\s+as\s+u32\b', '1i32', s)
          s, n2 = re.subn(r'\bXBUTTON2\s+as\s+u32\b', '2i32', s)
          s, n3 = re.subn(r'\bXBUTTON1\b\s*,?', '', s, count=1)
          s, n4 = re.subn(r'\bXBUTTON2\b\s*,?', '', s, count=1)
          s, n5 = re.subn(r'\bGetAsyncKeyState\s*,\s*', '', s, count=1)
          if 'MOUSEEVENTF_XUP,' not in s:
              raise SystemExit('MOUSEEVENTF_XUP marker missing')
          s = s.replace('MOUSEEVENTF_XUP,', 'MOUSEEVENTF_XUP, GetAsyncKeyState,', 1)
          if (n1, n2, n3, n4, n5) != (2, 2, 1, 1, 1):
              raise SystemExit(f'unexpected WinAPI patch counts: {(n1,n2,n3,n4,n5)}')
          p.write_text(s, encoding='utf-8', newline='\n')
          PY

      - name: Fix native hotkey capture and 5.22 style intro
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('pro2-rust/src-tauri/src/main.rs')
          s = p.read_text(encoding='utf-8')
          capture_core = r'''
          fn vk_code_is_down(vk: i32) -> bool {
              unsafe { (GetAsyncKeyState(vk) as u16 & 0x8000) != 0 }
          }

          fn capture_hotkey_blocking() -> Option<String> {
              let mut keys: Vec<(String, i32)> = vec![
                  ("MOUSE1".into(), 0x01), ("MOUSE2".into(), 0x02), ("MOUSE3".into(), 0x04),
                  ("MOUSE4".into(), 0x05), ("MOUSE5".into(), 0x06),
                  ("BACKSPACE".into(), 0x08), ("TAB".into(), 0x09), ("ENTER".into(), 0x0D),
                  ("SHIFT".into(), 0x10), ("CTRL".into(), 0x11), ("ALT".into(), 0x12),
                  ("ESC".into(), 0x1B), ("SPACE".into(), 0x20),
                  ("PAGEUP".into(), 0x21), ("PAGEDOWN".into(), 0x22), ("END".into(), 0x23),
                  ("HOME".into(), 0x24), ("LEFT".into(), 0x25), ("UP".into(), 0x26),
                  ("RIGHT".into(), 0x27), ("DOWN".into(), 0x28),
                  ("INSERT".into(), 0x2D), ("DELETE".into(), 0x2E),
              ];
              for c in b'0'..=b'9' { keys.push(((c as char).to_string(), c as i32)); }
              for c in b'A'..=b'Z' { keys.push(((c as char).to_string(), c as i32)); }
              for n in 1..=24 { keys.push((format!("F{n}"), 0x70 + n - 1)); }

              let release_deadline = Instant::now() + Duration::from_secs(2);
              while Instant::now() < release_deadline {
                  if !keys.iter().any(|(_, vk)| vk_code_is_down(*vk)) { break; }
                  thread::sleep(Duration::from_millis(6));
              }

              let deadline = Instant::now() + Duration::from_secs(12);
              while Instant::now() < deadline {
                  for (name, vk) in &keys {
                      if vk_code_is_down(*vk) {
                          if name == "ESC" { return None; }
                          while vk_code_is_down(*vk) && Instant::now() < deadline {
                              thread::sleep(Duration::from_millis(5));
                          }
                          return Some(name.clone());
                      }
                  }
                  thread::sleep(Duration::from_millis(4));
              }
              None
          }
          '''.strip('\n')
          marker = 'fn settings_path() -> PathBuf {'
          if marker not in s: raise SystemExit('settings_path marker missing')
          s = s.replace(marker, capture_core + '\n\n' + marker, 1)

          capture_cmd = r'''
          #[tauri::command]
          async fn capture_hotkey() -> Option<String> {
              tauri::async_runtime::spawn_blocking(capture_hotkey_blocking)
                  .await
                  .unwrap_or(None)
          }
          '''.strip('\n')
          marker = '#[tauri::command]\nfn cursor_position() -> Result<(i32, i32), String> {'
          if marker not in s: raise SystemExit('cursor_position marker missing')
          s = s.replace(marker, capture_cmd + '\n\n' + marker, 1)
          old = 'stop_all, cursor_position, pick_background, host_lobby, join_lobby, leave_lobby'
          if old not in s: raise SystemExit('invoke handler marker missing')
          s = s.replace(old, 'stop_all, capture_hotkey, cursor_position, pick_background, host_lobby, join_lobby, leave_lobby', 1)
          p.write_text(s, encoding='utf-8', newline='\n')

          p = Path('pro2-rust/ui/app.js')
          s = p.read_text(encoding='utf-8')
          start = s.find('function normalizeKey(e) {')
          end = s.find('\nfunction bindValue(', start)
          if start < 0 or end < 0: raise SystemExit('hotkey JS block markers missing')
          block = r'''async function beginCapture(target) {
            if (capture) return;
            const button = $(hotkeyButtons[target]);
            capture = { target, button, old: button.textContent };
            button.textContent = 'PRESS KEY…';
            button.classList.add('capturing');
            try {
              const key = await invoke('capture_hotkey');
              if (!capture || capture.target !== target) return;
              finishCapture(key || null, !key);
            } catch (e) {
              if (capture && capture.target === target) finishCapture(null, true);
              toast(`Hotkey capture error: ${e}`);
            }
          }
          function setHotkey(target, key) {
            if (target === 'clicker1') settings.clicker1.hotkey = key;
            else if (target === 'clicker2') settings.clicker2.hotkey = key;
            else if (target === 'bolt_push') settings.bolt_push.hotkey = key;
            else if (target === 'bolts') settings.bolts.hotkey = key;
            else if (target === 'wallhop') settings.wallhop.hotkey = key;
          }
          function getHotkey(target) {
            if (target === 'clicker1') return settings.clicker1.hotkey;
            if (target === 'clicker2') return settings.clicker2.hotkey;
            if (target === 'bolt_push') return settings.bolt_push.hotkey;
            if (target === 'bolts') return settings.bolts.hotkey;
            return settings.wallhop.hotkey;
          }
          function finishCapture(key, cancel=false) {
            if (!capture) return;
            const { target, button, old } = capture;
            button.classList.remove('capturing');
            if (cancel || !key) button.textContent = old;
            else {
              setHotkey(target, key);
              button.textContent = `HOTKEY · ${key}`;
              saveSettings();
              toast(`${target.replace('_',' ').toUpperCase()} → ${key}`);
            }
            capture = null;
            renderDashboardMeta();
          }

          $$('.hotkey').forEach(b => b.addEventListener('click', () => beginCapture(b.dataset.hotkey)));
          '''.strip('\n')
          s = s[:start] + block + s[end:]
          p.write_text(s, encoding='utf-8', newline='\n')

          p = Path('pro2-rust/ui/index.html')
          s = p.read_text(encoding='utf-8')
          old = '''  <div id="intro" class="intro">\n    <div class="intro-orbit orbit-1"></div><div class="intro-orbit orbit-2"></div>\n    <div class="intro-mark">R</div>\n    <div class="intro-title">RIUCLICKER <b>PRO</b></div>\n    <div class="intro-sub">PRO 2.0 · STARTING</div>\n    <div class="intro-line"><i></i></div>\n  </div>'''
          new = '''  <div id="intro" class="intro intro-522">\n    <div class="intro-orbit orbit-1"></div><div class="intro-orbit orbit-2"></div>\n    <div class="intro-522-window">\n      <div class="intro-522-kicker">RIUCLICKER PRO 2.0</div>\n      <div class="intro-title intro-522-title">xDragonsx on top</div>\n      <div class="intro-sub">STARTING</div>\n      <div class="intro-line"><i></i></div>\n    </div>\n  </div>'''
          if old not in s: raise SystemExit('intro HTML marker missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8', newline='\n')

          p = Path('pro2-rust/ui/styles.css')
          s = p.read_text(encoding='utf-8')
          css = '.intro-522-window{position:relative;z-index:2;min-width:430px;padding:34px 42px 30px;border-radius:24px;border:1px solid rgba(255,255,255,.11);background:linear-gradient(145deg,rgba(21,25,40,.94),rgba(11,13,24,.92));box-shadow:0 28px 90px rgba(0,0,0,.55),0 0 55px rgba(139,92,246,.14);backdrop-filter:blur(24px);text-align:center;animation:markIn .7s cubic-bezier(.2,.9,.2,1) forwards}.intro-522-kicker{font-size:9px;font-weight:900;letter-spacing:3px;color:#77839f}.intro-522-title{font-size:30px!important;letter-spacing:1px!important;font-weight:900!important;margin-top:15px!important;background:linear-gradient(90deg,#fff,#c9baff 48%,#82edf8);-webkit-background-clip:text;color:transparent}.intro-522-window .intro-sub{margin-top:10px}.intro-522-window .intro-line{margin-left:auto;margin-right:auto}'
          if '.intro-522-window{' not in s:
              s = s.rstrip() + '\n' + css + '\n'
          p.write_text(s, encoding='utf-8', newline='\n')
          PY

          grep -Fq 'capture_hotkey_blocking' pro2-rust/src-tauri/src/main.rs
          grep -Fq 'capture_hotkey,' pro2-rust/src-tauri/src/main.rs
          grep -Fq "invoke('capture_hotkey')" pro2-rust/ui/app.js
          grep -Fq 'xDragonsx on top' pro2-rust/ui/index.html
          node --check pro2-rust/ui/app.js

      - name: Generate Windows icon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'pro2-rust/src-tauri/icons'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $path = Join-Path $dir 'icon.ico'
          $w = 32; $h = 32
          $pixelBytes = $w * $h * 4
          $maskStride = [int](($w + 31) / 32) * 4
          $maskBytes = $maskStride * $h
          $imageBytes = 40 + $pixelBytes + $maskBytes
          $fs = [IO.File]::Open($path, [IO.FileMode]::Create)
          $bw = [IO.BinaryWriter]::new($fs)
          try {
            $bw.Write([UInt16]0); $bw.Write([UInt16]1); $bw.Write([UInt16]1)
            $bw.Write([Byte]$w); $bw.Write([Byte]$h); $bw.Write([Byte]0); $bw.Write([Byte]0)
            $bw.Write([UInt16]1); $bw.Write([UInt16]32); $bw.Write([UInt32]$imageBytes); $bw.Write([UInt32]22)
            $bw.Write([UInt32]40); $bw.Write([Int32]$w); $bw.Write([Int32]($h * 2))
            $bw.Write([UInt16]1); $bw.Write([UInt16]32); $bw.Write([UInt32]0); $bw.Write([UInt32]$pixelBytes)
            $bw.Write([Int32]0); $bw.Write([Int32]0); $bw.Write([UInt32]0); $bw.Write([UInt32]0)
            for ($y = 0; $y -lt $h; $y++) {
              for ($x = 0; $x -lt $w; $x++) {
                $dx = $x - 15.5; $dy = $y - 15.5
                if (($dx*$dx + $dy*$dy) -lt 220) {
                  $r = [Byte](110 + [int](($x / 31.0) * 95)); $g = [Byte](70 + [int](($y / 31.0) * 45)); $b = [Byte]238
                } else { $r = [Byte]14; $g = [Byte]16; $b = [Byte]30 }
                $bw.Write($b); $bw.Write($g); $bw.Write($r); $bw.Write([Byte]255)
              }
            }
            for ($i = 0; $i -lt $maskBytes; $i++) { $bw.Write([Byte]0) }
          } finally { $bw.Dispose(); $fs.Dispose() }

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pro2-rust/src-tauri -> target
          cache-on-failure: true

      - name: Compile RiuClicker Pro 2.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --manifest-path pro2-rust/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Rust build failed' }
          New-Item -ItemType Directory -Path out -Force | Out-Null
          Copy-Item pro2-rust/src-tauri/target/release/riu-clicker-pro.exe out/RiuClicker-Pro-2.0-Beta.exe
          if ((Get-Item out/RiuClicker-Pro-2.0-Beta.exe).Length -lt 1000000) { throw 'EXE unexpectedly small' }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item out/RiuClicker-Pro-2.0-Beta.exe package/
          Compress-Archive -Path package/* -DestinationPath out/RiuClicker-Pro-2.0-Beta.zip -Force
          Compress-Archive -Path pro2-rust/* -DestinationPath out/RiuClicker-Pro-2.0-Beta-Source.zip -Force
          (Get-FileHash out/RiuClicker-Pro-2.0-Beta.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content out/RiuClicker-Pro-2.0-Beta.sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: RiuClicker-Pro-2.0-Beta-Hotkey-Intro-Fix
          path: |
            out/RiuClicker-Pro-2.0-Beta.exe
            out/RiuClicker-Pro-2.0-Beta.zip
            out/RiuClicker-Pro-2.0-Beta-Source.zip
            out/RiuClicker-Pro-2.0-Beta.sha256.txt
          retention-days: 30

      - name: Publish beta release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          @(
            '# RiuClicker Pro 2.0 Beta', '',
            '- Native Windows hotkey capture: the UI now shows the actual key you press instead of sticking on TAB.',
            '- F1-F24, letters, digits, navigation keys and Mouse 1-5 are captured natively.',
            '- Startup intro now shows: xDragonsx on top.',
            '- Keeps Macro Lobby, dual Bolt actions and V V V ordering fixes.'
          ) | Set-Content notes.md
          $assets = @('out/RiuClicker-Pro-2.0-Beta.exe','out/RiuClicker-Pro-2.0-Beta.zip','out/RiuClicker-Pro-2.0-Beta-Source.zip','out/RiuClicker-Pro-2.0-Beta.sha256.txt')
          gh release view pro-v2.0-beta --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload pro-v2.0-beta $assets --clobber
            gh release edit pro-v2.0-beta --title 'RiuClicker Pro 2.0 Beta' --notes-file notes.md --prerelease
          } else {
            gh release create pro-v2.0-beta $assets --title 'RiuClicker Pro 2.0 Beta' --notes-file notes.md --target main --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish Pro 2.0 release' }

      - name: Record build status
        if: always()
        shell: pwsh
        run: |
          @(
            "status=${{ job.status }}",
            "run_id=${{ github.run_id }}",
            "commit=${{ github.sha }}",
            'tag=pro-v2.0-beta',
            'build=native-hotkey-capture-intro-522',
            'engine=rust-aether'
          ) | Set-Content pro2-hotkey-intro-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pro2-hotkey-intro-status.txt
          git commit -m 'Record RiuClicker Pro 2.0 hotkey intro status' 2>$null
          if ($LASTEXITCODE -eq 0) { git push }
