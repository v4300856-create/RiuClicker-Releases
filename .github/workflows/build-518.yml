name: Build 5.18 Aurora

on:
  pull_request:
    branches: [main]
    paths:
      - '.build/source518.part*'
      - '.github/workflows/build-518.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source
        shell: pwsh
        run: |
          $names = @(
            '.build/source518.part00',
            '.build/source518.part01',
            '.build/source518.part02',
            '.build/source518.part02tail',
            '.build/source518.part03',
            '.build/source518.part04'
          )
          foreach ($name in $names) {
            if (-not (Test-Path $name)) { throw "Missing source chunk: $name" }
          }
          $b64 = ($names | ForEach-Object { Get-Content $_ -Raw }) -join ''
          [IO.File]::WriteAllBytes("source518.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Path source518.zip -DestinationPath src -Force
          if (-not (Test-Path 'src/RiuClickerCS.csproj')) { throw 'Project file missing after source reconstruction' }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Riu
        shell: pwsh
        run: |
          dotnet publish src/RiuClickerCS.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:AssemblyName=RiuClicker `
            -p:ApplicationIcon=app.ico `
            -o out/riu
          Copy-Item out/riu/RiuClicker.exe out/RiuClicker-5.18.exe

      - name: Build Strawberry
        shell: pwsh
        run: |
          dotnet publish src/RiuClickerCS.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DefineConstants=STRAWBERRY `
            -p:AssemblyName=StrawberryClicker `
            -p:ApplicationIcon=strawberry.ico `
            -o out/strawberry
          Copy-Item out/strawberry/StrawberryClicker.exe out/StrawberryClicker-5.18.exe

      - name: Package source and builds
        shell: pwsh
        run: |
          Compress-Archive -Path src/* -DestinationPath out/Riu-Strawberry-5.18-Source.zip -Force
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item out/RiuClicker-5.18.exe package/
          Copy-Item out/StrawberryClicker-5.18.exe package/
          Copy-Item out/Riu-Strawberry-5.18-Source.zip package/
          Compress-Archive -Path package/* -DestinationPath out/Riu-and-Strawberry-5.18.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Riu-Strawberry-5.18
          if-no-files-found: error
          path: |
            out/RiuClicker-5.18.exe
            out/StrawberryClicker-5.18.exe
            out/Riu-Strawberry-5.18-Source.zip
            out/Riu-and-Strawberry-5.18.zip
