name: Publish RiuClicker Pro 1.1 Prism

on:
  push:
    branches: [main]
    paths:
      - '.build/pro11-publish-trigger.txt'
      - '.github/workflows/pro11-publish.yml'
      - '.build/pro11-hotfix.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-riuclicker-pro11
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified Riu source base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh api "/repos/${{ github.repository }}/actions/artifacts/9359887752/zip" > artifact.zip
          if ($LASTEXITCODE -ne 0) { throw 'Could not download verified 5.20 source artifact' }
          Expand-Archive artifact.zip -DestinationPath artifact -Force
          $source = Get-ChildItem artifact -Recurse -Filter 'Riu-Strawberry-5.20-Source.zip' | Select-Object -First 1
          if (-not $source) { throw 'Source bundle missing' }
          Expand-Archive $source.FullName -DestinationPath src -Force
          if (-not (Test-Path 'src/RiuClickerCS.csproj')) { throw 'Source extraction failed' }

      - name: Apply current Riu fixes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          python .build/localization520-hotfix.py
          gh api -H "Accept: application/vnd.github.raw" "/repos/${{ github.repository }}/contents/.build/cps520-hotfix.py?ref=release/5.20-cpsfix" > cps520-hotfix.py
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch CPS patch' }
          python cps520-hotfix.py
          python .build/ui522-hotfix.py
          python .build/pro-riuclicker.py
          python .build/pro11-hotfix.py
          if ($LASTEXITCODE -ne 0) { throw 'Pro 1.1 Prism patch failed' }

      - name: Validate Pro 1.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml](Get-Content 'src/App.xaml' -Raw) | Out-Null
          [xml](Get-Content 'src/MainWindow.xaml' -Raw) | Out-Null
          if (-not (Select-String 'src/MainWindow.xaml' -Pattern 'PreviewKeyDown="Window_PreviewKeyDown"' -SimpleMatch)) { throw 'TAB capture guard missing' }
          if (-not (Select-String 'src/MainWindow.xaml.cs' -Pattern 'e.Key == Key.Tab' -SimpleMatch)) { throw 'TAB capture handler missing' }
          if (Select-String 'src/MainWindow.xaml' -Pattern 'x:Name="C1HotkeyButton" Content="ЗАПУСК · F8"' -SimpleMatch) { throw 'Stale F8 hotkey label remains' }
          if (-not (Select-String 'src/MainWindow.xaml' -Pattern 'PRISM COMMAND' -SimpleMatch)) { throw 'Prism UI marker missing' }
          if (-not (Select-String 'src/App.xaml' -Pattern 'RIU PRO 1.1 · PRISM COMMAND UI' -SimpleMatch)) { throw 'Prism design system missing' }
          if (-not (Select-String 'src/MainWindow.xaml' -Pattern 'Tag="boltpush|instant"' -SimpleMatch)) { throw 'Bolt Push Instant missing' }
          if (-not (Select-String 'src/MainWindow.xaml' -Pattern 'Tag="bolts|turbo"' -SimpleMatch)) { throw 'Bolts Turbo missing' }
          if (-not (Select-String 'src/MainWindow.xaml' -Pattern 'Content="↗   Wallhop"' -SimpleMatch)) { throw 'Wallhop missing' }
          if (-not (Select-String 'src/MainWindow.Pro.cs' -Pattern 'Math.Max(8, t.FinalSafety)' -SimpleMatch)) { throw 'Instant Shift safety missing' }
          if (-not (Select-String 'src/SquadSyncService.cs' -Pattern 'command is not ("E" or "V")' -SimpleMatch)) { throw 'Squad restriction missing' }
          if (-not (Select-String 'src/RiuClickerCS.csproj' -Pattern '<Version>1.1.0</Version>' -SimpleMatch)) { throw 'Version 1.1 missing' }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build RiuClicker Pro 1.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src/RiuClickerCS.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:AssemblyName=RiuClickerPro `
            -p:ApplicationIcon=app.ico `
            -o out/pro
          if ($LASTEXITCODE -ne 0) { throw 'RiuClicker Pro 1.1 build failed' }
          Copy-Item out/pro/RiuClickerPro.exe out/RiuClicker-Pro-1.1-Beta.exe
          if ((Get-Item 'out/RiuClicker-Pro-1.1-Beta.exe').Length -lt 10000000) { throw 'Pro exe unexpectedly small' }

      - name: Package Pro 1.1
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item out/RiuClicker-Pro-1.1-Beta.exe package/
          Compress-Archive -Path package/* -DestinationPath out/RiuClicker-Pro-1.1-Beta.zip -Force
          Compress-Archive -Path src/* -DestinationPath out/RiuClicker-Pro-1.1-Beta-Source.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: RiuClicker-Pro-1.1-Beta
          path: |
            out/RiuClicker-Pro-1.1-Beta.exe
            out/RiuClicker-Pro-1.1-Beta.zip
            out/RiuClicker-Pro-1.1-Beta-Source.zip
          retention-days: 30

      - name: Publish Pro 1.1 beta release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          @(
            '# RiuClicker Pro 1.1 Beta · Prism Command',
            '',
            'Free RiuClicker is unchanged.',
            '',
            'Changes:',
            '- Fixed TAB hotkey capture/display for Auto Clicker',
            '- Removed stale hard-coded F8/F9 labels from live UI/help',
            '- New Prism Command interface: violet/cyan glass, wider command rail, active navigation, redesigned spacing/cards',
            '- Bolt Push and Bolts keep Stable / Fast / Turbo / Instant',
            '- Instant Shift-release safety retained',
            '- Wallhop retained',
            '- Squad Sync retained: Owner broadcasts only E/V',
            '- Photo/video backgrounds and precise CPS retained'
          ) | Set-Content pro11-release-notes.md
          $assets = @('out/RiuClicker-Pro-1.1-Beta.exe','out/RiuClicker-Pro-1.1-Beta.zip','out/RiuClicker-Pro-1.1-Beta-Source.zip')
          gh release view pro-v1.1-beta --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload pro-v1.1-beta $assets --clobber
            gh release edit pro-v1.1-beta --title 'RiuClicker Pro 1.1 Beta · Prism Command' --notes-file pro11-release-notes.md --prerelease
          } else {
            gh release create pro-v1.1-beta $assets --title 'RiuClicker Pro 1.1 Beta · Prism Command' --notes-file pro11-release-notes.md --target main --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish Pro 1.1 beta' }

      - name: Verify Pro 1.1 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view pro-v1.1-beta --json tagName,name,url,assets | ConvertFrom-Json
          if ($release.tagName -ne 'pro-v1.1-beta') { throw 'Wrong tag' }
          $names = @($release.assets | ForEach-Object { $_.name })
          foreach ($name in @('RiuClicker-Pro-1.1-Beta.exe','RiuClicker-Pro-1.1-Beta.zip','RiuClicker-Pro-1.1-Beta-Source.zip')) {
            if ($name -notin $names) { throw "$name missing" }
          }
          Write-Host "Verified: $($release.url)"

      - name: Record Pro 1.1 publish status
        if: always()
        shell: pwsh
        run: |
          @(
            "status=${{ job.status }}",
            "run_id=${{ github.run_id }}",
            "commit=${{ github.sha }}",
            'tag=pro-v1.1-beta',
            'build=prism-ui-tab-hotkey-fix'
          ) | Set-Content publish-pro11-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publish-pro11-status.txt
          git commit -m 'Record RiuClicker Pro 1.1 publish status' 2>$null
          if ($LASTEXITCODE -eq 0) { git push }
