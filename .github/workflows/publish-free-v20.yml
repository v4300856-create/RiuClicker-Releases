name: Publish RiuClicker FREE 2.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-free-v20.yml'
      - '.build/v20-common.py'
      - '.build/v20-free.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-riuclicker-free-v20
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download clean 5.22 source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri 'https://github.com/v4300856-create/RiuClicker-Releases/releases/download/riu-v5.22-restored/RiuClicker-5.22-Source.zip' -OutFile base.zip
          Expand-Archive base.zip -DestinationPath src -Force
          if(-not (Test-Path src/RiuClickerCS.csproj)){throw '5.22 source missing'}

      - name: Apply FREE key system and v2 UI
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python .build/license-v1.py
          python .build/supabase-key-v11.py
          python .build/v20-common.py
          python .build/v20-free.py
          python .build/settings-save-v1.py

      - name: Validate FREE source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          [xml](Get-Content src/App.xaml -Raw) | Out-Null
          [xml](Get-Content src/ActivationWindow.xaml -Raw) | Out-Null
          [xml](Get-Content src/MainWindow.xaml -Raw) | Out-Null
          [xml](Get-Content src/InterfacePickerWindow.xaml -Raw) | Out-Null
          foreach($m in @(
            'GET KEY · LOOTLABS',
            'PollAsync',
            'CreateSessionId',
            'PageMacros',
            'MacroKeyHold',
            'MacroModifierHold',
            'MacroStepGap',
            'MacroPointerSettle',
            'MacroRepeatDelay',
            'ВСЕ ЦИФРЫ МОЖНО МЕНЯТЬ',
            'CLASSIC 5.22',
            'COMPACT',
            'NEON',
            '<Version>2.0.0</Version>'
          )){
            if(-not (Get-ChildItem src -Recurse -Include *.cs,*.xaml,*.csproj | Select-String -SimpleMatch $m)){throw "Missing marker: $m"}
          }
          if(Get-ChildItem src -Recurse -Include *.cs,*.xaml | Select-String -Pattern 'BOLT PUSH|BOLTS|CLICK VVV CLICK'){throw 'Bolts code/UI still present in FREE'}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build FREE 2.0
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet publish src/RiuClickerCS.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:AssemblyName=RiuClicker-Free `
            -p:ApplicationIcon=app.ico `
            -o out
          if(-not (Test-Path out/RiuClicker-Free.exe)){throw 'FREE exe missing'}
          (Get-FileHash out/RiuClicker-Free.exe -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content out/RiuClicker-Free.sha256.txt

      - name: Publish FREE 2.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          @(
            '# RiuClicker FREE 2.0',
            '',
            '- Bolts removed',
            '- Original configurable 5.22 macro editor restored',
            '- Editable key hold / modifier hold / step gap / click settle / start delay / repeats / repeat delay',
            '- Three startup interfaces: Classic 5.22 / Compact / Neon',
            '- New LootLabs key window',
            '- FREE: one macro can run at a time',
            '- 24-hour device-bound FREE key flow'
          ) | Set-Content notes.md
          $tag='riu-free-v2'
          gh release view $tag *> $null
          if($LASTEXITCODE -eq 0){
            gh release upload $tag out/RiuClicker-Free.exe out/RiuClicker-Free.sha256.txt --clobber
            gh release edit $tag --title 'RiuClicker FREE 2.0' --notes-file notes.md --latest
          } else {
            gh release create $tag out/RiuClicker-Free.exe out/RiuClicker-Free.sha256.txt --title 'RiuClicker FREE 2.0' --notes-file notes.md --target main --latest
          }
